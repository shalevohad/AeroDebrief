# End-to-End Pipeline Tests CI/CD Workflow
# Runs comprehensive integration tests on multiple platforms

name: End-to-End Pipeline Tests

on:
  push:
    branches: [ main, develop, Unified-player-with-settings ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

jobs:
  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
    
    - name: Run End-to-End Pipeline Tests
      run: |
        dotnet test `
          --configuration Release `
          --no-build `
          --filter "TestCategory=EndToEnd" `
          --logger "trx;LogFileName=test-results-windows.trx" `
          --logger "console;verbosity=detailed" `
          --collect:"XPlat Code Coverage" `
          -- RunConfiguration.TestSessionTimeout=600000
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: '**/test-results-windows.trx'
    
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-windows
        path: '**/coverage.cobertura.xml'

  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
    
    - name: Run End-to-End Pipeline Tests
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --filter "TestCategory=EndToEnd" \
          --logger "trx;LogFileName=test-results-linux.trx" \
          --logger "console;verbosity=detailed" \
          --collect:"XPlat Code Coverage" \
          -- RunConfiguration.TestSessionTimeout=600000
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux
        path: '**/test-results-linux.trx'
    
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-linux
        path: '**/coverage.cobertura.xml'

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
    
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
    
    - name: Run End-to-End Pipeline Tests
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --filter "TestCategory=EndToEnd" \
          --logger "trx;LogFileName=test-results-macos.trx" \
          --logger "console;verbosity=detailed" \
          --collect:"XPlat Code Coverage" \
          -- RunConfiguration.TestSessionTimeout=600000
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-macos
        path: '**/test-results-macos.trx'
    
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-macos
        path: '**/coverage.cobertura.xml'

  report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [test-windows, test-linux, test-macos]
    if: always()
    
    steps:
    - name: Download Windows test results
      uses: actions/download-artifact@v4
      with:
        name: test-results-windows
        path: test-results/windows
      continue-on-error: true
    
    - name: Download Linux test results
      uses: actions/download-artifact@v4
      with:
        name: test-results-linux
        path: test-results/linux
      continue-on-error: true
    
    - name: Download macOS test results
      uses: actions/download-artifact@v4
      with:
        name: test-results-macos
        path: test-results/macos
      continue-on-error: true
    
    - name: Generate test report
      uses: dorny/test-reporter@v1
      with:
        name: End-to-End Pipeline Test Results
        path: 'test-results/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: false
